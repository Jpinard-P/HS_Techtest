version: 2

models:
  - name: stg_listings
    description: >
      One row per rental listing. Cleaned from raw.listings: rows with a NULL
      id are dropped (unusable as a join key), PRICE has its currency symbol
      stripped and is cast to decimal, and the JSON-array string columns
      (HOST_VERIFICATIONS, AMENITIES) are cast to VARCHAR[] so their contents
      are queryable. Column names are lightly renamed for clarity/consistency
      with the other staging models (e.g. id -> listing_id).
    columns:
      - name: listing_id
        description: Primary key. Rows with a NULL raw id are excluded upstream of this model.
        tests:
          - unique
          - not_null
      - name: listing_price
        description: Listing price as of the start of the CALENDAR date range, in USD.

  - name: stg_calendar
    description: >
      One row per listing per calendar day. Cleaned from raw.calendar: exact
      duplicate rows are collapsed with DISTINCT (found one case, three
      identical rows for the same listing/date), and RESERVATION_ID's "NULL"
      sentinel string is converted to a real NULL before casting to BIGINT.
    columns:
      - name: listing_id
        description: Foreign key to stg_listings.listing_id.
      - name: calendar_date
        description: The date this row describes. Combined with listing_id, forms the grain of this model.
      - name: is_available
        description: True if the listing had no reservation on this date.
      - name: reservation_id
        description: NULL when there was no reservation on this date.

  - name: stg_amenities_changelog
    description: >
      One row per amenities-list change per listing. Cleaned from
      raw.amenities_changelog: the AMENITIES JSON-array string is cast to
      VARCHAR[].
    columns:
      - name: listing_id
        description: Foreign key to stg_listings.listing_id.
      - name: change_at
        description: Timestamp the amenities list changed to this value. Combined with listing_id, forms the grain of this model.
