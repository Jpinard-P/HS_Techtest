# Rental analytics: a day/listing mart over LISTINGS, CALENDAR and
# AMENITIES_CHANGELOG, for revenue, occupancy and point-in-time amenity
# analysis. The project name prefixes every node's unique_id and keys the
# `models:` block below, so it is not free to change casually.
name: 'rental_analytics'
version: '1.0.0'

# Selects the connection in profiles.yml, which must define a matching key.
profile: 'rental_analytics'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
# Analysis parameters. These belong to a specific business question, not to the
# data: problem 2 asks for the price increase between two named dates. They are
# vars rather than literals in the query so that re-running the same analysis
# over a different period is a flag, not an edit.
#
# They currently coincide with the extent of the loaded calendar, which is why
# the model layer must not assume the two are the same thing -- the models
# derive coverage from the data, and only this analysis pins these dates.
vars:
  price_comparison_start_date: '2021-07-12'
  price_comparison_end_date: '2022-07-11'

# Materialisation by layer. These are baseline defaults; models that need
# something else configure it in their own file, which is currently only
# marts/listing_days.sql (incremental -- see its header and README.md).
#
#   staging      - views. Thin renames/casts over the CSVs; cheap to recompute,
#                  and keeping them virtual means there is one less copy of the
#                  raw data to fall out of date.
#   intermediate - views in a separate 'intermediate' schema. Not part of the
#                  analyst contract and not exposed in the production schema,
#                  but queryable for troubleshooting.
#   marts        - tables. This is what the reporting layer hits, so it is
#                  materialised once and read many times.
models:
  rental_analytics:
    staging:
      +materialized: view
    intermediate:
      # Views in a dedicated schema rather than ephemeral. The guide allows
      # either; a separate schema keeps these out of the production schema
      # analysts browse, while still leaving them queryable so a wrong number
      # in a mart can be traced one layer at a time.
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
