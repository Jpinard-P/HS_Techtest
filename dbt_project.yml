# Rental analytics: a day/listing mart over LISTINGS, CALENDAR and
# AMENITIES_CHANGELOG, for revenue, occupancy and point-in-time amenity
# analysis. The project name prefixes every node's unique_id and keys the
# `models:` block below, so it is not free to change casually.
name: 'rental_analytics'
version: '1.0.0'

# Selects the connection in profiles.yml, which must define a matching key.
profile: 'rental_analytics'

# Where dbt looks for each kind of file.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
#
# There is deliberately no vars: block. Problem 2's comparison dates live as
# literals in analyses/02 and in the golden-answer test, the two places that
# use them -- a question that names its own dates should name them in the
# query. No date belongs at project scope: the models derive calendar
# coverage from the data, and analysis periods belong to analyses.

# Materialisation by layer. These are baseline defaults; models that need
# something else configure it in their own file, which is currently only
# marts/listing_days.sql (incremental -- see its header and README.md).
#
#   staging      - views, own schema. Thin renames/casts over the CSVs; cheap
#                  to recompute, and keeping them virtual means there is one
#                  less copy of the raw data to fall out of date.
#   intermediate - views, own schema. Not part of the analyst contract, but
#                  queryable for troubleshooting.
#   marts        - tables. This is what the reporting layer hits, so it is
#                  materialised once and read many times.
#
# Staging and intermediate sit in their own schemas rather than ephemeral or
# mixed into the marts' schema: the schema analysts browse ('main') holds only
# the two marts, while every layer stays queryable so a wrong number in a mart
# can be traced one layer at a time.
# Seeds are project-owned reference data, not source data. The one seed,
# currency_symbols, exists for the staging price parsing, so it lives in the
# staging schema alongside its only consumers.
seeds:
  rental_analytics:
    +schema: staging

models:
  rental_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
