version: 2

models:
  - name: stg_amenities_changelog
    description: >
      One row per amenities-list change per listing. Cleaned from
      raw.amenities_changelog: the AMENITIES JSON-array string is cast to
      VARCHAR[].
    columns:
      - name: listing_id
        data_type: INTEGER
        description: Unique ID for the listing to which this row applies. Part of the Primary Key, and a foreign key to stg_listings.listing_id.
        data_tests:
          - not_null:
              description: >
                Part of the documented grain, and the partition key for the
                SCD2 in int_amenities_versioned. A NULL would put an amenity
                change in no listing's version sequence.
          - relationships:
              description: >
                The documented foreign key to stg_listings. Errors rather than
                warns, for the same reason as the equivalent test on
                stg_calendar: listing 276450, the only orphan either table
                carried, is now identified by the id recovery in stg_listings.
              arguments:
                to: ref('stg_listings')
                field: listing_id

      - name: change_at
        data_type: TIMESTAMP
        description: >
          When the amenities list changed. Part of the Primary Key. Documented
          as DATETIME, which DuckDB stores and reports as TIMESTAMP.
        data_tests:
          - not_null:
              description: >
                Part of the documented grain, and the ordering key the SCD2
                uses to turn changes into validity windows. A NULL has no
                position in that sequence, so the version it belongs to would
                get an undefined start.

      - name: amenities
        data_type: VARCHAR[]
        description: Array of the amenities available as of the change. Parsed from the source's JSON-array string.
