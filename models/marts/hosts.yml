version: 2

models:
  - name: hosts
    description: >
      One row per host: the customer dimension. Portfolio size and spread,
      occupancy, revenue, and review standing, rolled up from the listings
      mart. 36 hosts in the current extract, 8 of them operating more than
      one listing.
    columns:
      - name: host_id
        description: Unique ID for the host. Primary key.
        data_tests:
          - unique:
              description: >
                The dimension's primary key. A duplicate would fan out any
                join from a host-level analysis and double the portfolio it
                describes.
          - not_null:
              description: >
                Staging already rejects NULL host_ids; this asserts the
                rollup kept that promise at the published grain.
      - name: host_name
        description: >
          Display name. any_value over the host's listings, which is safe
          because assert_host_attributes_agree pins that every listing of a
          host repeats identical host attributes.
      - name: host_since
        description: When the host signed up.
      - name: host_location
        description: Where the host is based.
      - name: listings_count
        description: Listings the host operates.
      - name: neighborhoods_count
        description: Distinct neighborhoods the portfolio spans.
      - name: neighborhoods
        description: Sorted list of those neighborhoods.
      - name: nights_in_calendar
        description: Total calendar nights across the portfolio, inside the loaded calendar.
      - name: nights_reserved
        description: Total reserved nights across the portfolio.
      - name: occupancy_rate
        description: >
          nights_reserved over nights_in_calendar -- night-weighted across
          the portfolio, not averaged per listing, so one busy unit is not
          diluted by row counting.
      - name: revenue_in_calendar
        description: Total earned revenue across the portfolio, inside the loaded calendar.
      - name: total_reviews
        description: Reviews across the portfolio, all time.
      - name: average_review_score
        description: Mean of the portfolio's listing-level review scores. Unweighted by review count -- the source does not carry per-review data to weight with.
      - name: first_review_date
        description: Earliest first-review date across the portfolio.
      - name: last_review_date
        description: Most recent review date across the portfolio.
