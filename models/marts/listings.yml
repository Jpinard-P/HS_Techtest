version: 2

models:
  - name: listings
    description: >
      One row per listing, with descriptive attributes, current amenities, and
      calendar-coverage totals. Use this for listing-level questions;
      listing_days already carries the attributes needed to slice daily
      measures, so joining this to the fact is usually unnecessary.

      Contains only the 49 listings with a row in LISTINGS. Listing 276450 has
      calendar and amenity history but no descriptive record, so it is absent
      here while remaining present in listing_days.
    columns:
      - name: listing_id
        description: Unique ID for this listing. Primary key.
        tests:
          - unique
          - not_null
      - name: listing_name
        description: Display name of listing.
      - name: host_id
        description: Unique ID for the Host who owns this property.
        tests:
          - not_null
      - name: host_name
        description: Display name of Host.
      - name: host_since
        description: When the Host signed up.
      - name: host_location
        description: Where the Host is based.
      - name: host_verifications
        description: Methods the Host can use to verify.
      - name: neighborhood
        description: The neighborhood where this listing is located.
      - name: property_type
        description: Description of the type of property.
      - name: room_type
        description: Description of the type of room.
      - name: accommodates
        description: Number of guests this room can accommodate.
      - name: bathrooms_text
        description: Number and types of bathrooms available.
      - name: bedrooms
        description: Number of bedrooms available for use.
      - name: beds
        description: Number of beds available for use.
      - name: price_at_calendar_start
        description: >
          The listing-level PRICE, which the source documents as the price at
          the start of the CALENDAR range. Named for what it is so it is not
          mistaken for a current or average price; daily prices live in
          listing_days.
      - name: number_of_reviews
        description: The number of reviews this listing has ever received.
      - name: first_review_date
        description: The date of the first review this listing received.
      - name: last_review_date
        description: The date of the most recent review this listing received.
      - name: review_scores_rating
        description: The average review score of this listing.
      - name: amenities
        description: The listing's current amenity set, from the latest changelog version.
      - name: amenity_count
        description: Number of amenities currently listed.
      - name: amenities_last_changed_at
        description: When the current amenity set took effect.
      - name: amenity_version_count
        description: How many amenity versions the changelog holds for this listing.
      - name: has_air_conditioning
        description: Current state. Exact match on 'Air conditioning'; see listing_days for why this is not a LIKE.
      - name: has_lockbox
        description: Current state. Exact match on 'Lockbox'.
      - name: has_first_aid_kit
        description: Current state. Exact match on 'First aid kit'.
      - name: nights_in_calendar
        description: Calendar nights this listing has inside the loaded calendar.
      - name: nights_reserved
        description: Nights reserved inside the loaded calendar. Divided by nights_in_calendar, the listing's occupancy rate.
      - name: revenue_in_calendar
        description: Total earned revenue inside the loaded calendar.
