version: 2

models:
  - name: listing_days
    description: >
      Reporting mart: one row per listing per calendar day, covering
      2021-07-12 to 2022-07-11. Built to support period-over-period revenue and
      occupancy analysis and point-in-time amenity analysis.

      Materialized incrementally on (listing_id, calendar_date) so that days
      which age out of the source's rolling calendar window are retained rather
      than lost on the next rebuild. The published window is fully restated
      each run, because future days change as they sell. See README.md for the
      reasoning and the scale path.

      The table is not scoped to any analysis period. It covers exactly what the
      source calendar contains, and every coverage flag on it is derived from
      the data at run time, so loading more calendar extends the mart and
      corrects the flags without a code change. Analysis periods belong in the
      queries that need them -- see the vars used by
      analyses/02_neighborhood_price_increase.sql.

      Two things to know before using it. First, the loaded calendar does not
      start or end on month boundaries, so its first and last months are only
      partly covered (currently 20 days of July 2021 and 11 of July 2022) --
      filter on is_complete_month for any month-over-month comparison. Second,
      revenue and nightly_price are different measures: revenue is what a night
      earned, nightly_price is what it asked for.
    columns:
      - name: listing_id
        description: The listing. Not a foreign key to listings for every row -- see has_listing_record.
        data_tests:
          - not_null:
              description: >
                Half the mart's grain, and the column
                assert_listing_days_grain_is_unique groups by -- a NULL would
                evade that uniqueness check.
      - name: calendar_date
        description: The day. Together with listing_id, the grain of this table.
        data_tests:
          - not_null:
              description: >
                The other half of the mart's grain, and the basis of every
                time series built on this table.
      - name: has_listing_record
        description: >
          Whether this row's listing has a descriptive record in LISTINGS.
          True throughout the current extract. It exists because the mart is
          built on the calendar spine rather than on LISTINGS: a listing with
          calendar days but no descriptive row keeps its days here and is
          flagged, instead of vanishing from the mart through an inner join.
          That matters -- dropping one such listing's 365 days moves the
          amenity-revenue answer from 21.2% to 22.1% -- and it makes excluding
          them a deliberate WHERE clause, which problem 2's query applies as a
          guard (in the current build it excludes nothing, since 276450's ID
          is recovered in staging).

      - name: month_start_date
        description: First day of this row's month. The intended grouping key for monthly analysis.
      - name: calendar_year
        description: Calendar year of this day.
      - name: calendar_month
        description: Calendar month number of this day.
      - name: day_name
        description: Weekday name, for day-of-week seasonality.
      - name: is_weekend
        description: True for Saturday and Sunday.
      - name: is_complete_month
        description: >
          False where the loaded calendar covers only part of the month --
          currently July 2021 and July 2022. Computed on each run by comparing
          the days the source calendar covers against the length of the
          calendar month, so it reflects the data loaded rather than any fixed
          date range. On rows retained after their day ages out of the source,
          it keeps the value from the last restatement. Period-over-period
          comparisons that do not filter on this will read a partly covered
          month as a collapse in demand.
        data_tests:
          - not_null:
              description: >
                The flag analysts filter on to avoid comparing a partial month
                against a full one. A NULL is dropped by `where
                is_complete_month` without comment, so the failure mode is a
                month quietly missing from a comparison rather than an error.
      - name: days_of_month_in_calendar
        description: >
          How many days of this row's month the loaded calendar actually
          covers, for pro-rating a partly covered month rather than dropping it.

      - name: listing_name
        description: Display name of the listing. NULL where has_listing_record is false.
      - name: host_id
        description: Host who owns the property. NULL where has_listing_record is false.
      - name: neighborhood
        description: Neighborhood of the listing. NULL where has_listing_record is false.
      - name: property_type
        description: Type of property. NULL where has_listing_record is false.
      - name: room_type
        description: Type of room. NULL where has_listing_record is false.
      - name: accommodates
        description: Guests the listing sleeps. NULL where has_listing_record is false.
      - name: bedrooms
        description: Bedrooms available. NULL where has_listing_record is false, and where the source omits it.
      - name: beds
        description: Beds available. NULL where has_listing_record is false.

      - name: is_available
        description: True if the listing was open for booking on this day.
        data_tests:
          - not_null:
              description: >
                Occupancy is counted from this flag and revenue is gated on
                it, so a NULL would understate both without failing anything.
      - name: is_reserved
        description: True if the listing was booked on this day. The occupancy numerator; avg(is_reserved::int) over a period is the occupancy rate.
      - name: reservation_id
        description: The reservation occupying this night. NULL when the night is available.
      - name: reservation_nights
        description: Total nights of the reservation this night belongs to, visible within the loaded calendar. NULL on available nights.
      - name: reservation_first_night
        description: First visible night of this night's reservation. NULL on available nights.
      - name: reservation_last_night
        description: Last visible night of this night's reservation. NULL on available nights.

      - name: nightly_price
        description: >
          The price asked for this night, whether or not it sold. Summing this
          gives potential revenue, not earned revenue -- use revenue for
          takings and this for pricing analysis.
        data_tests:
          - not_null:
              description: >
                revenue is derived from this column on reserved nights. A NULL
                price would make revenue NULL, and SUM() skips NULLs -- so the
                money would disappear from a total that still looked like a
                valid number.
      - name: revenue
        description: >
          What this night actually earned: nightly_price when reserved, 0 when
          available. Additive across any combination of days, listings, and
          months.
      - name: price_currency
        description: >
          ISO 4217 currency that nightly_price and revenue are denominated
          in. 'USD' on every row of the current extract, and
          assert_prices_share_one_currency fails the build if a second
          currency ever appears -- totals and averages over money columns are
          only meaningful within one currency, so when that test fires,
          currency becomes a mandatory filter or grouping key.
      - name: minimum_nights
        description: Minimum consecutive nights bookable, as of this day.
      - name: maximum_nights
        description: Maximum consecutive nights bookable, as of this day.

      - name: availability_run_key
        description: Identifies the unbroken vacancy this night belongs to, within the listing. NULL on reserved nights.
      - name: available_run_start_date
        description: First night of this vacancy. NULL on reserved nights.
      - name: available_run_end_date
        description: Last night of this vacancy. NULL on reserved nights.
      - name: available_run_nights
        description: Length of this vacancy in nights. NULL on reserved nights.
      - name: max_bookable_nights
        description: >
          Longest stay this vacancy could take: the shorter of the vacancy and
          the owner's maximum_nights. MAX of this per listing answers "longest
          possible stay" directly. NULL on reserved nights. minimum_nights is
          deliberately not applied -- problem 3 asks for availability windows
          and maximum limits only -- so a vacancy shorter than its own minimum
          still reports its length here; check minimum_nights before reading
          this as "a stay this long is offered".
      - name: available_run_touches_calendar_edge
        description: >
          True where the vacancy runs to the start or end of the 365-day
          loaded calendar, so its length is a lower bound, not a measurement.

      - name: amenities
        description: >
          The amenity set in force on this specific day, resolved as-of from
          the changelog rather than taken from the listing's current state.
        data_tests:
          - not_null:
              description: >
                Asserts the as-of amenity join is total: every listing-day
                resolves to exactly one amenity version. A NULL here is the
                gap case -- a day falling between two validity windows --
                which is the failure assert_amenity_versions_do_not_overlap is
                designed to prevent upstream.
      - name: amenity_count
        description: Number of amenities in force on this day.
      - name: amenity_version_number
        description: Which changelog version applied on this day.
      - name: amenities_effective_from
        description: When the amenity set in force on this day was recorded.
      - name: has_air_conditioning
        description: >
          Exact match on 'Air conditioning'. Deliberately not a LIKE: the
          vocabulary also contains 'Hair dryer' and 'Conditioner', which
          '%air%' and '%conditio%' would both wrongly match.
      - name: has_lockbox
        description: Exact match on 'Lockbox'. The vocabulary also contains 'Lock on bedroom door'.
      - name: has_first_aid_kit
        description: Exact match on 'First aid kit'.
